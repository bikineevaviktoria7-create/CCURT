<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Область камеры, не жест русского жестового языка">
<rect width="640" height="480" rx="24" fill="#ecfdf5"/>
<rect x="120" y="65" width="400" height="310" rx="24" fill="none" stroke="#047857" stroke-width="3" stroke-dasharray="12 10"/>
<text x="320" y="210" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#19362d">Вся рука внутри рамки</text>
<text x="320" y="250" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5d7168">Запястье и пальцы видны</text>
<text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5d7168">Держите руку в центре</text>
</svg>
